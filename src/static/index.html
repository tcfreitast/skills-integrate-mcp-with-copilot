<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="account-container">
        <h3>Account</h3>
        <p id="session-status" role="status">Checking your session...</p>
        <form id="login-form">
          <h4>Log in</h4>
          <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" autocomplete="current-password" required />
          </div>
          <button type="submit">Log in</button>
        </form>

        <form id="registration-form">
          <h4>Create a student account</h4>
          <div class="form-group">
            <label for="student-name">Name:</label>
            <input type="text" id="student-name" autocomplete="name" maxlength="120" required />
          </div>
          <div class="form-group">
            <label for="student-grade">Grade:</label>
            <input type="text" id="student-grade" maxlength="40" required />
          </div>
          <div class="form-group">
            <label for="registration-email">School email:</label>
            <input type="email" id="registration-email" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="registration-password">Password (at least 12 characters):</label>
            <input type="password" id="registration-password" autocomplete="new-password" minlength="12" maxlength="128" required />
          </div>
          <button type="submit">Create account</button>
        </form>
        <button id="logout-button" class="hidden" type="button">Log out</button>
      </section>

      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div id="target-email-group" class="form-group hidden">
            <label for="email">Student Email:</label>
            <input type="email" id="email" placeholder="student@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="message hidden" role="status"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
